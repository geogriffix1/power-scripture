<nav class="workbench-edit">
    <div class="workbench-settings">
        <button
            type="button"
            class="icon-settings"
            (click)="onClickSettings()"
            title="Settings for editing - Theme or Citation">
            <i class="psmenu-icon" title="Settings for editing"></i>
        </button>
    </div>
    <div class="workbench-title">
        {{editType}}
        <div class="settings">
            <h3>Choose Edit Type:</h3>
            <div class="settings-selector" *ngFor="let item of editTypes; index as i">
                @if (i > 0) {
                <button
                    type="button"
                    class="icon-circle-{{i == activeType ? 'checked' : 'unchecked'}}"
                    (click)="onRadioClickSettings(i)">
                        <i class="psmenu-icon"></i>
    
                <!-- <a class="menu-radio-{{i === activeType ? 'checked' : 'unchecked'}}" (click)=onRadioClickSettings(i)>
                    <i class="radio-icon"></i>
                    <span>{{item}}</span>
                </a> -->
                </button>
                <span>{{item}}</span>
                }
            </div>
        </div>
    </div>
</nav>
<section>
    @if(activeType == 0) {
    <div></div>
    }
    @else if(activeType == 1) {
    <app-edit-theme [activeThemeNode]="activeThemeNode"></app-edit-theme>
    }
    @else if(activeType > 1) {
    <app-edit-citation [activeCitationNode]="activeCitationNode"></app-edit-citation>
    }
</section>

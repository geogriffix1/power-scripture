<header class="bible-workbench">
  <h2>Work Bench</h2>
</header>

<nav class="bible-workbench">
  <div class="bible-workbench-menu">
    <button
      type="button"
      class="menu menu-icon-search"
      [class.is-active]="activeTool === 'search'"
      (click)="setActiveTool('search'); onSearchClick()">
      <i class="psmenu-icon" title="Search scriptures or themes"></i>
    </button>

    <button
      type="button"
      class="menu menu-icon-create"
      [class.is-active]="activeTool === 'create'"
      (click)="setActiveTool('create'); onCreateClick()">
      <i class="psmenu-icon" title="Create theme or citation"></i>
    </button>

    <button
      type="button"
      class="menu menu-icon-edit"
      [class.is-active]="activeTool === 'edit'"
      (click)="setActiveTool('edit'); onEditClick()">
      <i class="psmenu-icon" title="Edit theme or citation"></i>
    </button>

    <button
      type="button"
      class="menu menu-icon-delete"
      [class.is-active]="activeTool === 'delete'"
      (click)="setActiveTool('delete'); onDeleteClick()">
      <i class="psmenu-icon" title="Delete theme or citation"></i>
    </button>

    <button
      type="button"
      class="menu menu-icon-import"
      [class.is-active]="activeTool === 'import'"
      (click)="setActiveTool('import'); onImportClick()">
      <i class="psmenu-icon" title="Import from file or console"></i>
    </button>

    <button
      type="button"
      class="menu menu-icon-publish"
      [class.is-active]="activeTool === 'publish'"
      (click)="setActiveTool('publish')">
      <i class="psmenu-icon" title="Publish scriptures from theme or citation"></i>
    </button>

    <button
      type="button"
      class="menu menu-icon-help"
      [class.is-active]="activeTool === 'help'"
      (click)="setActiveTool('help')">
      <i class="psmenu-icon" title="Help"></i>
    </button>
  </div>
</nav>

<section class="bible-workbench">
  <router-outlet></router-outlet>
</section>

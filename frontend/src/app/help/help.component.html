<div class="help-window">
  <header class="help-header">
    <div class="help-title">
      <i class="ps-icon ps-icon-help"></i>
      <span class="logo">Power Scripture</span>- &nbsp;Help
    </div>

    <button type="button" class="help-close-button" (click)="closeHelp()">
      ✕
    </button>
  </header>
  <div class="help-shell">
    <aside class="help-nav">
      <h2>Contents</h2>

      <h3 class="help-nav-group">Concepts</h3>
      @for (topic of topics; track topic.id) {
        @if (topic.group === 'concepts') {
          <button
            type="button"
            class="help-nav-button"
            [class.active]="topic.id === activeTopic.id"
            (click)="selectTopic(topic)"
          >
            <i [class]="topic.iconClass"></i>
            <span>{{ topic.title }}</span>
          </button>
        }
      }

      <h3 class="help-nav-group">Tools</h3>
      @for (topic of topics; track topic.id) {
        @if (topic.group === 'tools') {
          <button
            type="button"
            class="help-nav-button"
            [class.active]="topic.id === activeTopic.id"
            (click)="selectTopic(topic)"
          >
            <i [class]="topic.iconClass"></i>
            <span>{{ topic.title }}</span>
          </button>
        }
      }
    </aside>

    <main class="help-content">
      <div [innerHTML]="activeTopic.content"></div>
    </main>
  </div>
</div>
